<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ReViver | Criar conta</title><link rel="stylesheet" href="../css/base.css"></head><body><div class="screen"><div class="app-shell"><main class="page"><a class="back js-back" href="#">‹</a><div class="form-layout"><form id="cadastroForm" class="panel form-panel"><h1 class="page-title" style="font-size:48px">Criar conta</h1><p class="page-subtitle">Preencha os dados abaixo para começar.</p><div class="form-fields">
<div class="field"><label for="cadNome">Nome completo</label><input class="input" id="cadNome" placeholder="Nome completo" required></div>
<div class="field"><label for="cadEmail">Email</label><input class="input" id="cadEmail" type="email" placeholder="Email"></div>
<div class="field"><label for="cadSenha">Senha</label><input class="input" id="cadSenha" type="password" placeholder="Senha"></div>
<div class="field"><label for="cadConfirm">Confirmar senha</label><input class="input" id="cadConfirm" type="password" placeholder="Confirmar senha"></div>
<div class="field"><label>Data e hora de criação do usuário</label><input class="input" id="createdAt" readonly></div>
<div class="field"><label>Data e hora da última atualização dos dados</label><input class="input" id="updatedAt" readonly></div>
<button class="primary-btn" type="submit">Cadastrar</button></div></form><aside class="panel side-message"><div><div class="eyebrow">ReViver</div><blockquote>Um novo começo é possível.<br>E ele começa com você.</blockquote><p>Seu cadastro serve para guardar suas preferências e facilitar o acompanhamento dentro da plataforma.</p></div><div class="leaf">✦</div></aside></div></main></div></div><script>const now=new Date().toLocaleString('pt-BR');document.getElementById('createdAt').value=now;document.getElementById('updatedAt').value=now;</script><script src="../js/app.js"></script></body></html>
