<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReViver | Entrar</title>

    <link rel="stylesheet" href="../css/base.css">
</head>

<body>

<div class="screen">

    <div class="app-shell">

        <main class="page">

            <a class="back" href="../index.html">‹</a>

            <div class="form-layout">

                <form id="loginForm" class="panel form-panel">

                    <h1 class="page-title" style="font-size:48px">
                        Entrar
                    </h1>

                    <p class="page-subtitle">
                        Entre na sua conta para continuar.
                    </p>

                    <div class="form-fields">

                        <div class="field">

                            <label for="loginEmail">
                                Email
                            </label>

                            <input
                                class="input"
                                id="loginEmail"
                                type="email"
                                placeholder="Digite seu email"
                                required
                            >

                        </div>

                        <div class="field">

                            <label for="loginSenha">
                                Senha
                            </label>

                            <input
                                class="input"
                                id="loginSenha"
                                type="password"
                                placeholder="Digite sua senha"
                                required
                            >

                        </div>

                        <button
                            class="primary-btn"
                            type="submit"
                        >
                            Entrar
                        </button>

                        <a
                            class="secondary-btn"
                            href="cadastro.html"
                        >
                            Criar uma conta
                        </a>

                        <button
                            type="button"
                            id="anonymousButton"
                            class="secondary-btn"
                        >
                            Entrar anonimamente
                        </button>

                    </div>

                </form>

                <aside class="panel side-message">

                    <div>

                        <div class="eyebrow">
                            ReViver
                        </div>

                        <blockquote>
                            Você não precisa passar por isso sozinho.
                        </blockquote>

                        <p>
                            Entre na sua conta para salvar seus dados
                            e continuar suas conversas.
                        </p>

                    </div>

                    <div class="leaf">
                        ✦
                    </div>

                </aside>

            </div>

        </main>

    </div>

</div>

<script src="../js/app.js"></script>

</body>

</html>
