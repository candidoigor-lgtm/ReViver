<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ReViver | Suas informações</title><link rel="stylesheet" href="../css/base.css"></head><body><div class="screen"><div class="app-shell"><main class="page"><a class="back js-back" href="#">‹</a><div class="leaf-watermark">✦</div><h1 class="page-title">Suas informações</h1><p class="page-subtitle">Nos conte um pouco sobre você.</p><form id="profileForm" class="panel form-panel" style="position:relative;z-index:1;max-width:1000px"><div class="form-fields">
<div class="field"><label for="nome">Nome completo</label><input class="input" id="nome" placeholder="Digite seu nome completo"></div>
<div class="field"><label for="idade">Idade</label><input class="input" id="idade" type="number" min="0" placeholder="Ex.: 18"></div>
<div class="field"><label for="droga">Substâncias usadas</label><select class="select" id="droga" multiple><option value="Álcool">Álcool</option><option value="Maconha">Maconha</option><option value="Cocaína">Cocaína</option><option value="Crack">Crack</option><option value="Heroína">Heroína</option><option value="Cigarro">Cigarro</option><option value="Outra">Outra</option></select><small>Use Ctrl/Cmd para selecionar mais de uma.</small></div>
<div class="field"><label for="cidade">Cidade</label><input class="input" id="cidade" placeholder="Ex.: Curitiba"></div>
<div class="field"><label for="estado">Estado</label><input class="input" id="estado" maxlength="2" placeholder="PR"></div>
<div class="field"><label for="situacao">Estágio de recuperação</label><select class="select" id="situacao"><option value="">Selecione</option><option value="pre_contemplacao">Pré-contemplação</option><option value="contemplacao">Contemplação</option><option value="preparacao">Preparação</option><option value="acao">Ação</option><option value="manutencao">Manutenção</option><option value="recaida">Recaída</option><option value="recuperado">Recuperado</option></select></div>
<button class="primary-btn" type="submit">Salvar informações</button></div></form></main></div></div><script src="../js/app.js"></script></body></html>
